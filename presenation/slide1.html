<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Title Slide</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&amp;family=Open+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            overflow: hidden;
        }
        .left-panel {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #ffffff;
            z-index: 10;
        }
        .right-panel {
            width: 480px;
            background-color: #0f172a; /* Dark Slate Blue */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .accent-line {
            width: 80px;
            height: 6px;
            background-color: #0ea5e9; /* Sky Blue/Teal */
            margin-bottom: 24px;
        }
        .title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 56px;
            line-height: 1.1;
            color: #1e293b;
            margin-bottom: 16px;
        }
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: 28px;
            color: #0f766e; /* Dark Teal */
            margin-bottom: 40px;
        }
        .meta-info {
            font-size: 18px;
            color: #64748b;
            margin-top: auto;
            border-left: 4px solid #e2e8f0;
            padding-left: 20px;
        }
        .meta-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .meta-item i {
            width: 24px;
            color: #0ea5e9;
            margin-right: 10px;
        }
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Icon Composition in Right Panel */
        .icon-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-icon {
            font-size: 160px;
            color: #f8fafc;
            opacity: 0.9;
        }
        .overlay-icon {
            font-size: 80px;
            color: #0ea5e9;
            position: absolute;
            bottom: -20px;
            right: -20px;
            background-color: #0f172a;
            border-radius: 50%;
            padding: 10px;
            border: 4px solid #0f172a;
        }
        .project-tag {
            background-color: #1e293b;
            color: #0ea5e9;
            padding: 8px 16px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-block;
        }
        .circle-decoration {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .c1 { width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .c2 { width: 450px; height: 450px; top: 50%; left: 50%; transform: translate(-50%, -50%); border-style: dashed;}
    </style>
</head>
<body>
<div class="slide-container">
<!-- Left Content Panel -->
<div class="left-panel">
<div>
<span class="project-tag">Medical AI Project</span>
</div>
<div class="accent-line"></div>
<h1 class="title">
                PNEUMONIA DETECTION <br/>
<span style="font-weight: 300;">FROM CHEST X-RAYS</span>
</h1>
<h2 class="subtitle">
                Using Convolutional Neural Networks and Transfer Learning
            </h2>
<div class="meta-info">
<p class="meta-item"><i class="fas fa-university"></i> University Final Project</p>
<p class="meta-item"><i class="fas fa-calendar-alt"></i> January 2026</p>
<p class="meta-item"><i class="fas fa-user-graduate"></i> Student Project - Medical AI</p>
<p class="meta-item" style="margin-top: 16px; font-size: 16px;">
<i class="fab fa-github"></i> Project code available on GitHub
                </p>
</div>
</div>
<!-- Right Visual Panel -->
<div class="right-panel">
<!-- Background Elements -->
<div class="circle-decoration c1"></div>
<div class="circle-decoration c2"></div>
<!-- Icon Composition -->
<div class="icon-container">
<i class="fas fa-lungs main-icon"></i>
<i class="fas fa-microchip overlay-icon"></i>
</div>
<div style="margin-top: 60px; text-align: center; color: rgba(255,255,255,0.7); font-family: 'Montserrat', sans-serif;">
<p style="margin: 5px 0; font-size: 14px;">Deep Learning</p>
<p style="margin: 5px 0; font-size: 14px;">Computer Vision</p>
<p style="margin: 5px 0; font-size: 14px;">Healthcare</p>
</div>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Model Comparison - Visual Analysis</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header Style */
        .header {
            height: 100px;
            padding: 0 60px;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border-bottom: 4px solid #f1f5f9;
            flex-shrink: 0;
            z-index: 10;
        }
        .header-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 38px;
            color: #1e293b;
            position: relative;
            padding-left: 24px;
        }
        .header-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 42px;
            background-color: #0ea5e9;
            border-radius: 4px;
        }

        /* Main Content */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 60px 30px 60px;
            background-color: #f8fafc;
        }

        /* Chart Container */
        .chart-display {
            flex: 1;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .chart-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Highlight Badge */
        .highlight-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Bottom Insights */
        .insights-bar {
            margin-top: 15px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .insight-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .insight-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .icon-green { background-color: #10b981; color: white; }
        .icon-blue { background-color: #3b82f6; color: white; }
        .icon-yellow { background-color: #f59e0b; color: white; }
        .icon-red { background-color: #ef4444; color: white; }

        .insight-text {
            font-size: 14px;
        }

        .insight-value {
            font-weight: 700;
            font-size: 16px;
            color: #10b981;
        }
</style>
</head>
<body>
<div class="slide-container">
<!-- Header -->
<div class="header">
<h1 class="header-title">Model Comparison - Comprehensive Visual Analysis</h1>
</div>

<!-- Main Content -->
<div class="content-area">

<!-- Chart Display -->
<div class="chart-display">
<img src="assets/images/model_comparison.png" alt="Model Comparison Charts" class="chart-image"/>
                
<div class="highlight-badge">
<i class="fas fa-chart-line"></i>
                    6-Panel Analysis
                </div>
</div>

<!-- Insights Bar -->
<div class="insights-bar">
<div class="insight-item">
<div class="insight-icon icon-green">
<i class="fas fa-arrow-up"></i>
</div>
<div class="insight-text">
<div style="opacity: 0.8; font-size: 12px;">Accuracy Improvement</div>
<div class="insight-value">+7.1%</div>
</div>
</div>

<div class="insight-item">
<div class="insight-icon icon-blue">
<i class="fas fa-balance-scale"></i>
</div>
<div class="insight-text">
<div style="opacity: 0.8; font-size: 12px;">Normal Recall Boost</div>
<div class="insight-value">47% → 67%</div>
</div>
</div>

<div class="insight-item">
<div class="insight-icon icon-yellow">
<i class="fas fa-exclamation-triangle"></i>
</div>
<div class="insight-text">
<div style="opacity: 0.8; font-size: 12px;">False Alarms Reduced</div>
<div class="insight-value">154 → 77 (50%↓)</div>
</div>
</div>

<div class="insight-item">
<div class="insight-icon icon-red">
<i class="fas fa-shield-virus"></i>
</div>
<div class="insight-text">
<div style="opacity: 0.8; font-size: 12px;">Safety Maintained</div>
<div class="insight-value">98.5% → 97.4%</div>
</div>
</div>

<div style="border-left: 2px solid rgba(255,255,255,0.2); padding-left: 20px; margin-left: 10px;">
<div style="font-size: 13px; opacity: 0.9; margin-bottom: 4px;">
<i class="fas fa-trophy" style="color: #fbbf24; margin-right: 6px;"></i>
                        Project Success
                    </div>
<div style="font-size: 11px; opacity: 0.7;">
                        Transfer learning delivers superior clinical performance
                    </div>
</div>
</div>

</div>
</div>
</body>
</html>
